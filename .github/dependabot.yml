version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      semver-patch-days: 3

  # Maintain dependencies for Golang
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    cooldown:
      semver-patch-days: 3

  # Maintain dependencies for Docker
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-patch-days: 3
